name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

permissions:
  contents: read

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.7.8
      # Libs + bins (the python crate's test target needs maturin to link).
      - run: cargo clippy --workspace --lib --bins --all-targets -- -D warnings
      - run: cargo clippy -p sdr-fox-python --lib -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.7.8
      # Run every crate that links on host. The python crate is built via
      # maturin in the `python` job below.
      - run: cargo test --workspace --exclude sdr-fox-python --exclude sdr-fox-jni
      # Integration tests + mock-stack end-to-end.
      - run: cargo test -p sdr-fox-tests

  c-abi:
    name: C ABI header + link check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.7.8
      - run: cargo build -p sdr-fox-cabi
      - name: Header parses and links
        run: |
          cc -c -I. -x c - <<'EOF'
          #include "bindings/sdr_fox.h"
          int main(void) { return SdrFoxKind_Rtlsdr; }
          EOF

  python:
    name: python (maturin build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.7.8
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Create Python virtual environment
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install maturin pytest
      - name: Build + install
        working-directory: crates/sdr-fox-python
        run: |
          source "$GITHUB_WORKSPACE/.venv/bin/activate"
          maturin develop --release
      - name: pytest (SIMD helper, no hardware)
        working-directory: crates/sdr-fox-python
        run: |
          source "$GITHUB_WORKSPACE/.venv/bin/activate"
          pytest tests/test_bindings.py -k "not hardware"

  android:
    name: Android NDK build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.7.8
      - run: cargo install cargo-ndk
      - name: Build JNI .so for both ABIs
        run: cargo ndk -t arm64-v8a -t x86_64 build --release -p sdr-fox-jni --features android
