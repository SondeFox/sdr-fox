# cbindgen configuration for sdr-fox-cabi.
# Generates bindings/sdr_fox.h — the source of truth for C consumers.

language = "c"
header = """/*
 * sdr-fox C API — auto-generated by cbindgen. Do not edit.
 * Library: sdr-fox (https://github.com/SondeFox/sdr-fox)
 * License: MIT OR Apache-2.0
 */"""
autogen_warning = "/* Warning: this file is auto-generated by cbindgen. Do not edit. */"
include_guard = "SDR_FOX_H"
include_version = true
cpp_compat = true

[parse]
parse_deps = false
clean = false

[export]
include = ["SdrFoxDevice", "SdrFoxStream", "SdrFoxKind", "SdrFoxFormat"]

[fn]
prefix = ""

[struct]
associated_constants_in_body = true

[enum]
prefix_with_name = true
enum_class = true

[defines]
"target_os = linux" = "SDR_FOX_LINUX"
"target_os = macos" = "SDR_FOX_MACOS"
"target_os = windows" = "SDR_FOX_WINDOWS"
"target_arch = aarch64" = "SDR_FOX_AARCH64"
